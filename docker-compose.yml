services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [iod_internal]

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
    networks: [iod_internal]

  queue:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      db:
        condition: service_healthy
    networks: [iod_internal]

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-iod_manager}
      MARIADB_USER: ${DB_USERNAME:-iod_manager}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - iod_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [iod_internal]

networks:
  iod_internal:
    driver: bridge

volumes:
  iod_db:

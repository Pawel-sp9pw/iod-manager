name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app-check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: iod_manager_test
          MARIADB_USER: iod_manager
          MARIADB_PASSWORD: iod_manager_test
          MARIADB_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
        if: ${{ hashFiles('package-lock.json') != '' }}

      - name: Validate Composer file
        run: composer validate --no-check-lock

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=iod_manager/DB_DATABASE=iod_manager_test/' .env
          sed -i 's/DB_PASSWORD=change-me/DB_PASSWORD=iod_manager_test/' .env

      - name: Lint PHP
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Migrate database
        run: php artisan migrate --force

      - name: Check routes
        run: php artisan route:list

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
